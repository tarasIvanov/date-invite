<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маю до тебе питання 💌</title>
  <style>
    :root {
      --bg1: #ffe3ec;
      --bg2: #ffc2d4;
      --ink: #4a1a2c;
      --accent: #e8436e;
      --accent-dark: #c92f58;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at 30% 20%, var(--bg1), var(--bg2));
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
    }
    .quest { display: none; text-align: center; padding: 24px; width: 100%; max-width: 520px; margin: auto; }
    .quest.active { display: block; }
    .emoji { font-size: 72px; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    h1 { font-size: clamp(26px, 6vw, 38px); margin: 12px 0 28px; line-height: 1.25; }
    .hint {
      min-height: 28px;
      margin: 0 0 12px;
      font-size: 20px;
      font-style: italic;
      color: var(--accent-dark);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .35s, transform .35s;
    }
    .hint.show { opacity: 1; transform: none; }
    .buttons { position: relative; height: 70px; display: flex; justify-content: center; gap: 24px; align-items: center; }
    button {
      font: inherit;
      font-size: 20px;
      padding: 14px 34px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.15);
      transition: transform .15s, background .15s;
    }
    #yes { background: var(--accent); }
    #yes:hover { background: var(--accent-dark); transform: scale(1.05); }
    #no { background: #8a7580; }
    #no.runaway { position: fixed; transition: left .25s ease-out, top .25s ease-out; z-index: 10; }
    h2 { font-size: 20px; margin: 26px 0 10px; text-align: left; }
    .opts { display: flex; gap: 10px; flex-wrap: wrap; }
    .opts label {
      flex: 1 1 200px; display: flex; align-items: center; gap: 10px; text-align: left;
      background: rgba(255,255,255,.65); border: 2px solid transparent; border-radius: 16px;
      padding: 12px 14px; cursor: pointer; font-size: 18px; transition: border-color .15s, background .15s;
    }
    .opts label:has(input:checked) { border-color: var(--accent); background: #fff; }
    .opts label.locked { cursor: not-allowed; opacity: .9; }
    .opts.col label { flex: 1 1 100%; }
    input[type=radio], input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
    .next { margin-top: 28px; background: var(--accent); }
    .next:disabled { background: #c9aab5; cursor: not-allowed; box-shadow: none; }
    #summary { text-align: left; font-size: 18px; line-height: 1.6; background: rgba(255,255,255,.65); border-radius: 16px; padding: 12px 18px; }
    .done p { font-size: 20px; }
    .heart { position: fixed; top: -40px; font-size: 28px; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Квест 1. Наступні квести — додавати як нові section.quest -->
  <section class="quest active" id="quest1">
    <div class="emoji">💌</div>
    <h1>Підеш зі мною на побачення?</h1>
    <p class="hint" id="hint" aria-live="polite">Навіть не спробуєш відмовитись? 🥺</p>
    <div class="buttons">
      <button id="yes">Так 💖</button>
      <button id="no">Ні</button>
    </div>
  </section>

  <!-- Квест 2: окремі сторінки по блоках питань -->
  <section class="quest" id="q2-role">
    <div class="emoji">🥰</div>
    <h1>Ура! Тепер кілька питань</h1>
    <h2>Ти сьогодні пасенджер-прінцес чи драйвер?</h2>
    <div class="opts">
      <label><input type="radio" name="role" value="Пасенджер-прінцес 👑"> Пасенджер-прінцес 👑</label>
      <label><input type="radio" name="role" value="Драйвер 🚗"> Драйвер 🚗</label>
    </div>
    <button class="next" data-next="q2-plan" data-need="role" disabled>Далі</button>
  </section>

  <section class="quest" id="q2-plan">
    <div class="emoji">🎬</div>
    <h2>Що робитимемо?</h2>
    <div class="opts col">
      <label><input type="radio" name="plan" value="Попкорн + фільм"> 🍿 Попкорн + фільм</label>
      <label><input type="radio" name="plan" value="Прогулянка та вечеря"> 🌆 Прогулянка та вечеря</label>
    </div>
    <button class="next" data-next="q2-extra" data-need="plan" disabled>Далі</button>
  </section>

  <section class="quest" id="q2-extra">
    <div class="emoji">✨</div>
    <h2>Додатково</h2>
    <div class="opts col">
      <label><input type="checkbox" name="extra" value="Купити щось солодке"> 🍫 Купити щось солодке</label>
      <label><input type="checkbox" name="extra" value="Не спізнитись"> ⏰ Не спізнитись</label>
      <label><input type="checkbox" name="extra" value="Під час зустрічі сильно зацілувати"> 😘 Під час зустрічі сильно зацілувати</label>
      <label class="locked"><input type="checkbox" name="extra" value="Пальчик в анальчик" checked disabled> 👉 Пальчик в анальчик</label>
    </div>
    <button class="next" id="finish2">Готово 💖</button>
  </section>

  <section class="quest done" id="quest2-done">
    <div class="emoji">💞</div>
    <h1>Записав!</h1>
    <div id="summary"></div>
    <p>Скоро буде ще щось цікаве...</p>
  </section>

  <script>
    (function () {
      var yes = document.getElementById('yes');
      var no = document.getElementById('no');
      var hint = document.getElementById('hint');
      var yesClicks = 0;
      var noTried = false;
      var RADIUS = 160;      // "недалеко" від поточного місця
      var MIN_JUMP = 90;     // щоб не стрибала на місці

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function dodge() {
        noTried = true;
        hint.classList.remove('show');   // після спроби натиснути «Ні» підказка зникає
        var w = no.offsetWidth, h = no.offsetHeight;
        var r = no.getBoundingClientRect();
        // перший раз — стаємо fixed на тому ж місці, без стрибка
        if (!no.classList.contains('runaway')) {
          no.classList.add('runaway');
          no.style.left = r.left + 'px';
          no.style.top = r.top + 'px';
        }
        var cx = r.left, cy = r.top, nx, ny, tries = 0;
        do {
          var a = Math.random() * Math.PI * 2;
          var d = MIN_JUMP + Math.random() * (RADIUS - MIN_JUMP);
          nx = clamp(cx + Math.cos(a) * d, 8, window.innerWidth - w - 8);
          ny = clamp(cy + Math.sin(a) * d, 8, window.innerHeight - h - 8);
          tries++;
        } while (Math.hypot(nx - cx, ny - cy) < MIN_JUMP / 2 && tries < 10);
        no.style.left = nx + 'px';
        no.style.top = ny + 'px';
      }

      // тікає при наведенні/дотику, клік до неї не доходить
      ['mouseenter', 'pointerdown', 'touchstart', 'focus'].forEach(function (ev) {
        no.addEventListener(ev, function (e) { e.preventDefault(); dodge(); }, { passive: false });
      });
      no.addEventListener('click', function (e) { e.preventDefault(); dodge(); });

      yes.addEventListener('click', function () {
        yesClicks++;
        // перше «Так» — питання над кнопкою; далі проходимо лише якщо вона хоч раз тицьнула «Ні»
        if (yesClicks === 1 || !noTried) {
          hint.classList.add('show');
          return;
        }
        show('q2-role');
      });

      function show(id) {
        document.querySelectorAll('.quest').forEach(function (q) { q.classList.remove('active'); });
        document.getElementById(id).classList.add('active');
        window.scrollTo(0, 0);
      }

      // Квест 2: кожен блок — окрема сторінка
      function val(name) {
        var c = document.querySelector('input[name=' + name + ']:checked');
        return c ? c.value : '';
      }
      document.querySelectorAll('.next[data-need]').forEach(function (btn) {
        var name = btn.dataset.need;
        document.querySelectorAll('input[name=' + name + ']').forEach(function (i) {
          i.addEventListener('change', function () { btn.disabled = false; });
        });
        btn.addEventListener('click', function () { show(btn.dataset.next); });
      });
      document.getElementById('finish2').addEventListener('click', function () {
        var extras = ['Пальчик в анальчик'];
        document.querySelectorAll('input[name=extra]:checked:not(:disabled)').forEach(function (c) { extras.unshift(c.value); });
        var s = document.getElementById('summary');
        s.innerHTML = '';
        [['Сьогодні', val('role')], ['Робимо', val('plan')], ['Додатково', extras.join(', ')]].forEach(function (r) {
          var p = document.createElement('div');
          var b = document.createElement('b'); b.textContent = r[0] + ': ';
          p.appendChild(b); p.appendChild(document.createTextNode(r[1]));
          s.appendChild(p);
        });
        show('quest2-done');
        hearts();
      });

      function hearts() {
        for (var i = 0; i < 40; i++) {
          var s = document.createElement('span');
          s.className = 'heart';
          s.textContent = ['💖', '💗', '💕', '❤️'][i % 4];
          s.style.left = Math.random() * 100 + 'vw';
          s.style.animationDuration = 2.5 + Math.random() * 3 + 's';
          s.style.animationDelay = Math.random() * 1.5 + 's';
          document.body.appendChild(s);
          setTimeout(function (el) { el.remove(); }.bind(null, s), 8000);
        }
      }
    })();
  </script>
</body>
</html>
